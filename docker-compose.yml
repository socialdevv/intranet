services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: intranet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intranet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_ALTCLOUD_API_DEV_USER_EMAIL: super.admin@intranet.local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3001
      LOG_LEVEL: info
      DATABASE_URL: postgresql://postgres:postgres@db:5432/intranet
      CORS_ALLOWED_ORIGINS: http://localhost:3001
      RATE_LIMIT_MAX: 200
      RATE_LIMIT_TIME_WINDOW: 1 minute
      UPLOAD_MAX_FILE_SIZE_BYTES: 314572800
      UPLOAD_RATE_LIMIT_MAX: 5
      UPLOAD_RATE_LIMIT_TIME_WINDOW: 1 minute
      ENABLE_SWAGGER: true
      ENABLE_PREVIEW_AUTH: "true"
      PREVIEW_AUTH_DEFAULT_USER_EMAIL: super.admin@intranet.local
      RUN_DB_SEED: auto
      STATIC_WEB_ROOT: /app/dist
      MEDIA_STORAGE_ROOT: /app/runtime-media
    volumes:
      # HA note for SRE: when running multiple app replicas, back this volume with a
      # shared network filesystem (NFS, AWS EFS, GlusterFS, etc.) so uploaded media
      # remains available to every instance.
      - app_media:/app/runtime-media

volumes:
  postgres_data:
  app_media:
